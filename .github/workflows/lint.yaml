name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main

  # Every safety property of this chart is an ABSENCE or a one-line declaration: `comment`, tags,
  # custom fields and the triage fields kept out of Ticket's update body; custom_field_options kept out
  # of TicketField's (a replace-by-id PUT that would strip categories from live tickets); the bodies
  # declared unwrapped; `compareScope: updatable` on every kind; the unwrap on every response. Nothing in
  # the generated CRD records any of it, and undoing one is silent — no error, just a controller that
  # starts re-posting comments or reverting agents. This job is the only thing that notices.
  drift-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 hack/assert-drift-invariants.py .

  # The chart renders only with a subdomain (the asset server URL is substituted at render time), so lint
  # and template with a placeholder one, after stamping CHART_VERSION exactly as release-oci does.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0
      - run: sed -i "s/CHART_VERSION/0.0.0-ci/g" chart/Chart.yaml
      - run: helm lint chart --strict --set zendeskSubdomain=your-subdomain
      - run: helm template zendesk-provider-kog chart -n krateo-system --set zendeskSubdomain=your-subdomain > /dev/null
      # With OAuth rotation on, the chart must render exactly one ESO Webhook generator and one
      # ExternalSecret, and the generator must POST the client_credentials grant to /oauth/tokens.
      - name: render with oauth.rotation.enabled
        run: |
          set -euo pipefail
          out=$(helm template zendesk-provider-kog chart -n krateo-system --set zendeskSubdomain=your-subdomain --set oauth.rotation.enabled=true)
          [ "$(echo "$out" | grep -c '^kind: Webhook$')" = 1 ] || { echo "::error::expected 1 Webhook generator"; exit 1; }
          [ "$(echo "$out" | grep -c '^kind: ExternalSecret$')" = 1 ] || { echo "::error::expected 1 ExternalSecret"; exit 1; }
          echo "$out" | grep -q 'url: "https://your-subdomain.zendesk.com/oauth/tokens"' || { echo "::error::generator URL"; exit 1; }
          echo "$out" | grep -q 'grant_type=client_credentials' || { echo "::error::grant type"; exit 1; }
          off=$(helm template zendesk-provider-kog chart -n krateo-system --set zendeskSubdomain=your-subdomain)
          ! echo "$off" | grep -q -E '^kind: (Webhook|ExternalSecret)$' || { echo "::error::rotation objects rendered while disabled"; exit 1; }
