apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-group
  namespace: {{ .Release.Namespace }}
data:
  # The asset is copied verbatim EXCEPT for its server URL, which zendesk.asset (_helpers.tpl) resolves
  # from .Values.zendeskSubdomain. It is NOT tpl-rendered: the asset may contain literal double-brace text
  # (Zendesk dynamic-content placeholders in comments) that must not be interpreted.
  group.yaml: |
{{ include "zendesk.asset" (dict "root" . "file" "assets/group.yaml") | indent 4 }}
