# The OAuth wiring each resource CR references via spec.configurationRef. Provision out-of-band and never
# commit a credential.
#
# Zendesk is removing API tokens (no new tokens from late Oct 2026, all deactivated 30 Apr 2027), so this
# provider authenticates with an OAuth access token from the client_credentials grant, sent as a bearer
# token. Those tokens EXPIRE (30 min by default, 48 h at most) and no refresh token is issued, so the
# token Secret below is NOT hand-made: the External Secrets Operator keeps it fresh (oauth.rotation in
# values.yaml). rest-dynamic-controller reads it on every reconcile, so a rotated token applies at once.
#
# 1. Create an OAuth client (Admin Center > Apps and integrations > APIs > OAuth clients; confidential).
#    Its agent needs admin rights: groups, ticket fields and organizations are admin-only.
# 2. Put the client in a Secret ESO's webhook generator may read (the label is required):
#
#   kubectl create secret generic zendesk-oauth-client -n krateo-system \
#     --from-literal=client_id=<IDENTIFIER> --from-literal=client_secret=<SECRET>
#   kubectl label secret zendesk-oauth-client -n krateo-system external-secrets.io/type=webhook
#
# 3. Install with oauth.rotation.enabled=true. ESO then writes zendesk-oauth-token (key access_token).
#
# One Configuration per kind, each pointing at that Secret. They may all share a name (the kind is
# implied by the resource that references it), which is why all four below are `zendesk-config`.
# You only need the Configurations for the kinds you actually use; the rest are inert.
---
apiVersion: zendesk.krateo.io/v1alpha1
kind: TicketConfiguration
metadata:
  name: zendesk-config
  namespace: krateo-system
spec:
  authentication:
    bearer:
      tokenRef:
        name: zendesk-oauth-token
        namespace: krateo-system
        key: access_token
---
apiVersion: zendesk.krateo.io/v1alpha1
kind: GroupConfiguration
metadata:
  name: zendesk-config
  namespace: krateo-system
spec:
  authentication:
    bearer:
      tokenRef:
        name: zendesk-oauth-token
        namespace: krateo-system
        key: access_token
---
apiVersion: zendesk.krateo.io/v1alpha1
kind: OrganizationConfiguration
metadata:
  name: zendesk-config
  namespace: krateo-system
spec:
  authentication:
    bearer:
      tokenRef:
        name: zendesk-oauth-token
        namespace: krateo-system
        key: access_token
---
apiVersion: zendesk.krateo.io/v1alpha1
kind: TicketFieldConfiguration
metadata:
  name: zendesk-config
  namespace: krateo-system
spec:
  authentication:
    bearer:
      tokenRef:
        name: zendesk-oauth-token
        namespace: krateo-system
        key: access_token
