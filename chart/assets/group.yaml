# Trimmed from Zendesk's official Support API OpenAPI document
# (https://developer.zendesk.com/zendesk/oas.yaml, operations CreateGroup / ShowGroupById /
# UpdateGroup / DeleteGroup). Every deviation from that document is commented where it is made.
#
# Bodies are declared UNWRAPPED (the CR domain); on the wire Zendesk takes and returns
# {"group": {...}}. rd-group.yaml wraps the request ({group: .}) and unwraps every response (.group).
# assets/ticket.yaml has the full reasoning: the controller filters an outgoing body by TOP-LEVEL key
# only, so a declared wrapper would ship the whole object, create-only fields included, on every update.
openapi: 3.0.3
info:
  title: Zendesk Support API - Groups
  # Official: 2.0.0 — see assets/ticket.yaml for why `v2`.
  version: v2
servers:
  # Official URL template, substituted by the chart's ConfigMap — see assets/ticket.yaml.
  - url: https://{subdomain}.{domain}.com
    variables:
      subdomain:
        default: your-subdomain
      domain:
        default: zendesk
paths:
  /api/v2/groups:
    post:
      operationId: CreateGroup
      summary: Create Group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateInput'
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
  /api/v2/groups/{group_id}:
    get:
      operationId: ShowGroupById
      summary: Show Group
      # Official also declares the `include` (sideload) query parameter; dropped (it would become a
      # spec field).
      parameters:
        - $ref: '#/components/parameters/group_id'
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    put:
      operationId: UpdateGroup
      summary: Update Group
      parameters:
        - $ref: '#/components/parameters/group_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdateInput'
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    # Groups are SOFT-deleted: the official Group schema says "Deleted groups get marked as such" via a
    # `deleted` boolean. rd-group.yaml therefore declares notFoundBody on the get verb, so a tombstone
    # answered with 200 + deleted:true reads as absent — both for observe and for the controller's
    # post-delete verification, which would otherwise hold the CR's finalizer forever.
    delete:
      operationId: DeleteGroup
      summary: Delete Group
      parameters:
        - $ref: '#/components/parameters/group_id'
      responses:
        '204':
          description: No content
components:
  securitySchemes:
    # Official declares basicAuth, bearerAuth and oauth2; trimmed to basicAuth — see assets/ticket.yaml.
    basicAuth:
      type: http
      scheme: basic
  parameters:
    group_id:
      name: group_id
      in: path
      required: true
      description: The ID of the group
      # Official: integer/int64. Declared string (path substitution form; never a spec field).
      schema:
        type: string
  schemas:
    GroupCreateInput:
      type: object
      required:
        - name
      properties:
        # COMPARED.
        name:
          type: string
        # COMPARED. Do not set it to "" — leave it out instead; an empty string is not proven to
        # round-trip as "" rather than null.
        description:
          type: string
        # CREATE-ONLY. Zendesk: "You can't change a private group to a public group." A compared
        # is_public:true on a group made private would be drift no update can fix, and the reverse
        # direction would silently change who can see the group. Set once, at creation.
        is_public:
          type: boolean
        # `default` (official: readOnly on GroupObject, absent from the create/update input) is NOT
        # modelled at all. The default group is an account-wide singleton: making one group default
        # demotes another, so two CRs could fight over it forever.
    # UPDATE body = the compared set: name and description, both returned verbatim.
    GroupUpdateInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    # RESPONSE in the CR domain (the `group` object, unwrapped).
    Group:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
        name:
          type: string
        description:
          type: string
        is_public:
          type: boolean
        default:
          type: boolean
        deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
security:
  - basicAuth: []
